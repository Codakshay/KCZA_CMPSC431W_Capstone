<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit Listing</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background-color: #fff;
      border-radius: 8px;
      padding: 40px;
      width: 400px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      margin-top: 50px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #5A67D8;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #434190;
    }
    a {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #5A67D8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Listing</h2>

    <form method="POST">
      <label>Product Title:</label>
      <input type="text" name="title" value="{{ listing[0] }}" required>

      <label>Category:</label>
      <input type="text" name="category" value="{{ listing[1] }}" required>

      <label>Quantity:</label>
      <input type="number" name="quantity" value="{{ listing[2] }}" required>

      <label>Price:</label>
      <input type="number" step="0.01" name="price" value="{{ listing[3] }}" required>

      <div style="margin-top: 20px;">
        <label>
          <input type="checkbox" name="promote" value="1" {% if listing[4] %}checked{% endif %}>
          Promote this listing
        </label>
      </div>

      <button type="submit" style="margin-top: 20px;">Save Changes</button>
    </form>

    <a href="{{ url_for('seller_dashboard') }}" style="display: block; margin-top: 20px;">Back to Dashboard</a>
  </div>
</body>

</html>
