<!DOCTYPE html>
<html>
<head>
    <title>Request Email Change</title>
</head>
<body>
  <h2>Email Change Request</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <p>Current Email: <strong>{{ current_email }}</strong></p>
    <label for="new_email">Requested New Email:</label>
    <input type="email" id="new_email" name="new_email" required>
    <br><br>
    <input type="submit" value="Submit Request">
  </form>

  <br>
  <a href="{{ url_for('profile') }}">Back to Profile</a>
</body>
</html>
