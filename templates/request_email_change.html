<!DOCTYPE html>
<html>
<head>
    <title>Request Email Change</title>
    <style>
        /* CSS Reset */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        /* Body styling with a gradient background */
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #74ebd5, #ACB6E5);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Container for the card */
        .container {
          background-color: #fff;
          border-radius: 8px;
          padding: 40px;
          width: 350px;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* Heading styling */
        h1 {
          text-align: center;
          margin-bottom: 20px;
          color: #333;
        }

        h2 {
          margin-bottom: 10px;
          color: #333;
          font-size: 1.1rem;
        }

        /* Form element styling */
        form {
          margin-bottom: 20px;
        }

        label {
          display: block;
          color: #555;
          font-size: 0.9rem;
          margin-bottom: 5px;
        }

        input[type="email"] {
          width: 100%;
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #ddd;
          border-radius: 4px;
        }

        input[type="submit"] {
          width: 100%;
          padding: 10px;
          border: none;
          background-color: #5A67D8;
          color: #fff;
          font-size: 1rem;
          border-radius: 4px;
          cursor: pointer;
          transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
          background-color: #434190;
        }

        /* Flash messages styling */
        .flash-messages {
          margin-bottom: 20px;
          padding: 10px;
          background-color: #E0F7FA;
          border: 1px solid #81D4FA;
          color: #01579B;
          border-radius: 4px;
        }

        .flash-messages ul {
          list-style-type: none;
        }

        .back-link {
          display: block;
          text-align: center;
          margin-top: 10px;
          color: #5A67D8;
          text-decoration: none;
        }

        .back-link:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
  <div class="container">
    <h1>Email Change Request</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          <ul>
            {% for msg in messages %}
              <li>{{ msg }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <p><strong>Current Email:</strong> {{ current_email }}</p>
      <label for="new_email">Requested New Email:</label>
      <input type="email" id="new_email" name="new_email" required>
      <input type="submit" value="Submit Request">
    </form>

    <a href="{{ url_for('profile') }}" class="back-link">Back to Profile</a>
  </div>
</body>
</html>
