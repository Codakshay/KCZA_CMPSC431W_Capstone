<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Info</title>
</head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        background-color: #fff;
        border-radius: 8px;
        padding: 40px;
        width: 800px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .results-container {
        background-color: #fff;
        border-radius: 12px;
        padding: 30px;
        width: 740px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .product-card {
        background: linear-gradient(to right, #f8f9fa, #e9ecef);
        border-left: 5px solid #5A67D8;
        padding: 20px;
        border-radius: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    }

    .product-card h3 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        color: #333;
    }

    .product-card p {
        margin: 4px 0;
        font-size: 0.95rem;
        color: #444;
        line-height: 1.4;
    }

    .product-card p strong {
        color: #222;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    h2 {
        margin-bottom: 10px;
        color: #333;
        font-size: 1.1rem;
    }

    label {
        display: block;
        color: #555;
        font-size: 0.9rem;
        margin-bottom: 5px;
    }

    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    button[type="submit"] {
        width: 100px;
        padding: 10px;
        border: none;
        background-color: #5A67D8;
        color: #fff;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-bottom: 20px;
    }

    button[type="submit"]:hover {
        background-color: #434190;
    }

    .flash-messages {
        margin-bottom: 20px;
        padding: 10px;
        background-color: #E0F7FA;
        border: 1px solid #81D4FA;
        color: #01579B;
        border-radius: 4px;
    }

    .flash-messages ul {
        list-style-type: none;
    }

    .nav-bar {
        text-align: center;
        margin-bottom: 20px;
    }

    .nav-bar a {
        margin: 0 10px;
        color: #5A67D8;
        text-decoration: none;
        font-size: 0.9rem;
    }

    .nav-bar a:hover {
        text-decoration: underline;
    }
</style>
<body>
  <p>ordering</p>
  <div class="product-card">
    <h2>{{ product.name }}</h2>
    
    <div class="product-detail">
      <span class="label">Seller:</span> {{ product.seller_email }}
    </div>
    
    <div class="product-detail">
      <span class="label">Name:</span> {{ product.name }}
    </div>
    
    <div class="product-detail">
      <span class="label">Unit Price:</span> ${{ "%.2f"|format(product.price) }}
    </div>
    
    <div class="product-detail">
      <span class="label">Available Quantity:</span> {{ product.quantity }}
    </div>
  </div>

  {% if message %}
    <p style="color: green;"><strong>{{ message }}</strong></p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="quantity" value="{{ quantity }}">
    <button type="submit">Purchase {{ quantity }}</button>
  </form>

</body>
</html>
