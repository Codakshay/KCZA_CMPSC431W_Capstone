<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login & Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* body styling with a gradient background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* container for the card */
    .container {
      background-color: #fff;
      border-radius: 8px;
      padding: 40px;
      width: 350px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    /* heading styling */
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    /* section headings */
    h2 {
      margin-bottom: 10px;
      color: #333;
      font-size: 1.1rem;
    }

    /* form element styling */
    form {
      margin-bottom: 20px;
    }

    /* label styling */
    label {
      display: block;
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    /* input styling for email and password */
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    /* label styling for submit */
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: #5A67D8;
      color: #fff;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    /* label styling for hover submit */
    input[type="submit"]:hover {
      background-color: #434190;
    }

    /* flash messages styling */
    .flash-messages {
      margin-bottom: 20px;
      padding: 10px;
      background-color: #E0F7FA; /* light blue background */
      border: 1px solid #81D4FA;  /* blue border */
      color: #01579B;             /* dark blue text */
      border-radius: 4px;
    }

    .flash-messages ul {
      list-style-type: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nittany Business</h1>

    <!-- flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          <ul>
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
    {% endwith %}

    <!-- register form -->
    <form method="post" action="/register">
      <h2>Register</h2>
      <label for="reg_email">Email:</label>
      <input type="email" id="reg_email" name="email" placeholder="Enter your email" required>

      <label for="reg_password">Password:</label>
      <input type="password" id="reg_password" name="password" placeholder="Enter your password" required>

      <input type="submit" value="Register">
    </form>

    <!-- login form -->
    <form method="post" action="/login">
      <h2>Login</h2>
      <label for="login_email">Email:</label>
      <input type="email" id="login_email" name="email" placeholder="Enter your email" required>

      <label for="login_password">Password:</label>
      <input type="password" id="login_password" name="password" placeholder="Enter your password" required>

      <input type="submit" value="Login">
    </form>
  </div>
</body>
</html>
