<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login/Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background-color: #fff;
      border-radius: 8px;
      padding: 40px;
      width: 400px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form {
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #555;
      font-size: 0.9rem;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input[type="email"],
    input[type="password"],
    input[type="submit"],
    input[type="text"],
    input[type="number"],
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    input[type="submit"],
    button {
      background-color: #5A67D8;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
      border: none;
    }

    input[type="submit"]:hover,
    button:hover {
      background-color: #434190;
    }

    .checkbox-group {
      margin-bottom: 15px;
    }

    .checkbox-group label {
      display: inline-block;
      margin-right: 15px;
      font-size: 0.95rem;
    }

    .flash-messages {
      margin-bottom: 20px;
      padding: 10px;
      background-color: #E0F7FA;
      border: 1px solid #81D4FA;
      color: #01579B;
      border-radius: 4px;
    }

    .flash-messages ul {
      list-style-type: none;
    }

    a {
      display: block;
      text-align: center;
      color: #5A67D8;
      text-decoration: none;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Registration</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          <ul>
            {% for msg in messages %}
              <li>{{ msg }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
    {% endwith %}

    <!-- Registration Form -->
<form action="{{ url_for('register') }}" method="POST">
  <label for="email">Register Email</label>
  <input type="email" id="email" name="email" placeholder="Email" required>

  <label for="password">Register Password</label>
  <input type="password" id="password" name="password" placeholder="Password" required>

  <label for="business_name">Business Name</label>
  <input type="text" id="business_name" name="business_name" placeholder="Business Name" required>

  <label for="street_num">Street Number</label>
  <input type="number" id="street_num" name="street_num" placeholder="Street Number" required>

  <label for="street_name">Street Name</label>
  <input type="text" id="street_name" name="street_name" placeholder="Street Name" required>

  <label for="zipcode">Zipcode</label>
  <input type="number" id="zipcode" name="zipcode" placeholder="Zipcode" required>

  <label for="bank_routing_number">Bank Routing Number (Required for Sellers)</label>
  <input type="number" id="bank_routing_number" name="bank_routing_number" placeholder="Bank Routing Number">

  <label for="bank_account_number">Bank Account Number (Required for Sellers)</label>
  <input type="number" id="bank_account_number" name="bank_account_number" placeholder="Bank Account Number">

  <div class="checkbox-group">
    <label><input type="checkbox" name="roles" value="Buyer"> Buyer</label>
    <label><input type="checkbox" name="roles" value="Seller"> Seller</label>
    <label><input type="checkbox" name="roles" value="HelpDesk" disabled> Help Desk</label>
    <small style="display:block; margin-top:5px; color:#999;">Help Desk access requires admin approval</small>
  </div>

  <input type="submit" value="Register">
</form>

    <h2>User Login</h2>

    <!-- Login Form -->
    <form action="{{ url_for('login') }}" method="POST">
      <label for="login_email">Login Email</label>
      <input type="email" id="login_email" name="email" placeholder="Email" required>

      <label for="login_password">Login Password</label>
      <input type="password" id="login_password" name="password" placeholder="Password" required>

      <input type="submit" value="Login">
    </form>

    <a href="{{ url_for('logout') }}">Logout</a>
  </div>
</body>
</html>
